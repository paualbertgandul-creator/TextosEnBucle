name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -o TextosEnBucle.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar
        working-directory: TextosEnBucle
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Textos en bucle
          files: TextosEnBucle/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
